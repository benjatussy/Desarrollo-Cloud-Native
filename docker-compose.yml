services:

  rabbitmq-1:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: "secret_cookie_value"
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - dcn_network
      - rabbitmq_cluster

  rabbitmq-2:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: "secret_cookie_value"
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - dcn_network
      - rabbitmq_cluster
    depends_on:
      - rabbitmq-1
      
  rabbit-service:
    build:
      context: ./DCNBackend-Mysql/version1
    container_name: rabbit-service
    restart: always
    ports:
      - "9090:9090"
    environment:
      - SERVER_PORT=9090
      - SPRING_RABBITMQ_HOST=rabbitmq-1
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/rabbit_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - rabbitmq-1
      - mysql
    networks:
      - dcn_network
      - rabbitmq_cluster
  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: users_db
    ports:
      - "3307:3306" 
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dcn_network

  api-gateway:
    build:
      context: ./DCNBackend-Mysql/api-gateway
    container_name: api-gateway
    restart: always
    ports:
      - "8089:8089"
    environment:
      - USERS_SERVICE_URL=http://user-service:8081
      - ITEMS_SERVICE_URL=http://item-service:8082
      - CATEGORIES_SERVICE_URL=http://category-service:8083
    depends_on:
      - user-service
      - item-service
      - category-service
    networks:
      - dcn_network

  user-service:
    build:
      context: ./DCNBackend-Mysql/user-service
    container_name: user-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=users_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - SPRING_RABBITMQ_HOST=rabbitmq-1
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
    depends_on:
      - mysql
      - rabbitmq-1
    networks:
      - dcn_network

  item-service:
    build:
      context: ./DCNBackend-Mysql/item-service
    container_name: item-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=items_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - SPRING_RABBITMQ_HOST=rabbitmq-1
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
    depends_on:
      - mysql
      - rabbitmq-1
    networks:
      - dcn_network

  category-service:
    build:
      context: ./DCNBackend-Mysql/category-service
    container_name: category-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=categories_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - SPRING_RABBITMQ_HOST=rabbitmq-1
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
    depends_on:
      - mysql
      - rabbitmq-1
    networks:
      - dcn_network

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - dcn_network

volumes:
  mysql_data:
  rabbitmq_data_1:
  rabbitmq_data_2:

networks:
  dcn_network:
    driver: bridge
  rabbitmq_cluster:
    driver: bridge
