services:

  rabbitmq-1:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: "secret_cookie_value"
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - dcn_network
      - rabbitmq_cluster

  rabbitmq-2:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: "secret_cookie_value"
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - dcn_network
      - rabbitmq_cluster
    depends_on:
      - rabbitmq-1

  kafka-1:
    image: apache/kafka:4.4.0
    hostname: kafka-1
    ports:
      - "19092:19092"
    environment: &kafka-node
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data_1:/var/lib/kafka/data
    networks:
      - dcn_network
    restart: unless-stopped

  kafka-2:
    image: apache/kafka:4.4.0
    hostname: kafka-2
    ports:
      - "29092:29092"
    environment:
      <<: *kafka-node
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092
    volumes:
      - kafka_data_2:/var/lib/kafka/data
    networks:
      - dcn_network
    restart: unless-stopped

  kafka-3:
    image: apache/kafka:4.4.0
    hostname: kafka-3
    ports:
      - "39092:39092"
    environment:
      <<: *kafka-node
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092
    volumes:
      - kafka_data_3:/var/lib/kafka/data
    networks:
      - dcn_network
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: dcn-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - dcn_network
    restart: unless-stopped
      
  rabbit-service:
    build:
      context: ./DCNBackend-Mysql/version1
    container_name: rabbit-service
    restart: always
    ports:
      - "9090:9090"
    environment:
      - SERVER_PORT=9090
      - SPRING_RABBITMQ_HOST=rabbitmq-1
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/rabbit_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - rabbitmq-1
      - mysql
    networks:
      - dcn_network
      - rabbitmq_cluster
  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: users_db
    ports:
      - "3307:3306" 
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dcn_network

  api-gateway:
    build:
      context: ./DCNBackend-Mysql/api-gateway
    container_name: api-gateway
    restart: always
    ports:
      - "8089:8089"
    environment:
      - USERS_SERVICE_URL=http://user-service:8081
      - ITEMS_SERVICE_URL=http://item-service:8082
      - CATEGORIES_SERVICE_URL=http://category-service:8083
    depends_on:
      - user-service
      - item-service
      - category-service
    networks:
      - dcn_network

  user-service:
    build:
      context: ./DCNBackend-Mysql/user-service
    container_name: user-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=users_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - SPRING_RABBITMQ_HOST=rabbitmq-1
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
    depends_on:
      - mysql
      - rabbitmq-1
    networks:
      - dcn_network

  item-service:
    build:
      context: ./DCNBackend-Mysql/item-service
    container_name: item-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=items_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - SPRING_RABBITMQ_HOST=rabbitmq-1
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      - mysql
      - rabbitmq-1
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - dcn_network

  analytics-service:
    build:
      context: ./DCNBackend-Mysql/analytics-service
    container_name: analytics-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=analytics_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - SPRING_KAFKA_STREAMS_APPLICATION_ID=shopping-activity-streams-v1
      - SPRING_KAFKA_CONSUMER_GROUP_ID=shopping-activity-read-model-v1
    depends_on:
      - mysql
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - dcn_network

  category-service:
    build:
      context: ./DCNBackend-Mysql/category-service
    container_name: category-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=categories_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - SPRING_RABBITMQ_HOST=rabbitmq-1
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
    depends_on:
      - mysql
      - rabbitmq-1
    networks:
      - dcn_network

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - dcn_network

volumes:
  mysql_data:
  rabbitmq_data_1:
  rabbitmq_data_2:
  kafka_data_1:
  kafka_data_2:
  kafka_data_3:

networks:
  dcn_network:
    driver: bridge
  rabbitmq_cluster:
    driver: bridge
