spring.application.name=analytics-service
server.port=8084
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=${AZURE_CLIENT_ID:482ff19e-3fc5-43ec-8a5e-31ec71c950d3}
spring.cloud.azure.active-directory.app-id-uri=${AZURE_APP_ID_URI:api://482ff19e-3fc5-43ec-8a5e-31ec71c950d3}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}
spring.kafka.streams.application-id=${SPRING_KAFKA_STREAMS_APPLICATION_ID:shopping-activity-streams-v1}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:shopping-activity-read-model-v1}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.shopping_list.analytics.contract.ShoppingActivityMetric
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.shopping_list.analytics.contract
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[delivery.timeout.ms]=120000
spring.kafka.producer.properties[request.timeout.ms]=30000
spring.kafka.producer.properties[spring.json.add.type.headers]=false
spring.kafka.admin.properties[request.timeout.ms]=10000

app.kafka.topics.shopping-activity-events=${APP_KAFKA_TOPICS_SHOPPING_ACTIVITY_EVENTS:shopping-activity-events}
app.kafka.topics.shopping-activity-metrics=${APP_KAFKA_TOPICS_SHOPPING_ACTIVITY_METRICS:shopping-activity-metrics}
app.kafka.topics.shopping-activity-events-dlt=${APP_KAFKA_TOPICS_SHOPPING_ACTIVITY_EVENTS_DLT:shopping-activity-events-dlt}
app.kafka.topics.shopping-activity-metrics-dlt=${APP_KAFKA_TOPICS_SHOPPING_ACTIVITY_METRICS_DLT:shopping-activity-metrics-dlt}

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:analytics_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
