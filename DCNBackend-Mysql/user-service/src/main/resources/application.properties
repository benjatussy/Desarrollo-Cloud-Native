# Application
spring.application.name=users-service

# Datasource
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:users_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8081

# Actuator
management.endpoints.web.exposure.include=health,info

# Azure Active Directory
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=482ff19e-3fc5-43ec-8a5e-31ec71c950d3
spring.cloud.azure.active-directory.app-id-uri=api://482ff19e-3fc5-43ec-8a5e-31ec71c950d3
