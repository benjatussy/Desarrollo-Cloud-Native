# Server
server.port=8089

# Application
spring.application.name=gateway

# Routes
spring.cloud.gateway.routes[0].id=users-service
spring.cloud.gateway.routes[0].uri=${USERS_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[1].id=items-service
spring.cloud.gateway.routes[1].uri=${ITEMS_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/items/**

spring.cloud.gateway.routes[2].id=categories-service
spring.cloud.gateway.routes[2].uri=${CATEGORIES_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/categories/**

# Habilitar integración con Azure AD como Resource Server (solo valida JWT)
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.application-type=resource_server

# Client ID del registro del API en Entra ID
spring.cloud.azure.active-directory.credential.client-id=482ff19e-3fc5-43ec-8a5e-31ec71c950d3
spring.cloud.azure.active-directory.profile.tenant-id=24597f44-c110-4081-a777-adae3102afac

# Application ID URI configurado en "Expose an API"
spring.cloud.azure.active-directory.app-id-uri=api://482ff19e-3fc5-43ec-8a5e-31ec71c950d3

# Issuer URI — Azure AD emite tokens con issuer v1.0 cuando accessTokenAcceptedVersion es null/1
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/24597f44-c110-4081-a777-adae3102afac/
spring.security.oauth2.resourceserver.jwt.audiences=api://482ff19e-3fc5-43ec-8a5e-31ec71c950d3,482ff19e-3fc5-43ec-8a5e-31ec71c950d3

# Debug para diagnóstico JWT (desactivar después)
logging.level.org.springframework.security=DEBUG
logging.level.com.azure.spring=DEBUG

# CORS para el frontend
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
